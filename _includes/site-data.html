{% comment %} Facts obsidian.js needs in the browser: where post images live, and post titles for [[links]]. {% endcomment %}
<script type="application/json" id="site-data">{"img": {{ '/assets/img/' | relative_url | jsonify }}, "posts": [{% for p in site.posts %}{"t": {{ p.title | jsonify }}, "u": {{ p.url | relative_url | jsonify }}, "f": {{ p.slug | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
