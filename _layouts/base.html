---
<!DOCTYPE html>
<html lang="{{ page.language | default: site.language | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  
</head>
<body>

<header>
  <a href="{{ '/' | relative_url }}" class="brand">
    <img src="{{ site.avatar | relative_url }}" alt="Logo" style="width: 24px; height: 24px; border-radius: 50%;">
    <strong>{{ site.title | upcase }}</strong><span class="full"> &nbsp;/&nbsp; {{ page.title | default: "Security Research" }}</span>
  </a>
  <div class="badge" data-state="granted">
    <span class="light"></span>
    <span class="label">LIVE</span>
  </div>
</header>

<main>
  {{ content }}
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>

</body>
</html>
