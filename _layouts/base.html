---
---
<!DOCTYPE html>
<html lang="{{ page.language | default: site.language | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  
</head>
<body>

<div class="site-wrapper">
  <header>
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ site.avatar | relative_url }}" alt="Logo">
      <div class="brand-text">
        <span class="brand-title">{{ site.title | upcase }}</span>
        <span class="brand-subtitle">Security Research</span>
      </div>
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-left">
      &copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}
    </div>
    <div class="footer-right">
      <a href="https://github.com/{{ site.github_username | default: 'attacker-codeninja' }}" target="_blank">GitHub</a>
    </div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>

</body>
</html>
