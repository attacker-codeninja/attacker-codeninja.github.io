<!DOCTYPE html>
<html lang="{{ page.language | default: site.language | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  
</head>
<body>
  <!-- ── App Header (always visible) ── -->
  <div id="app-header">
    <a href="{{ '/' | relative_url }}" style="text-decoration: none;">
      <span id="app-logo" title="Home">⬡ <span id="app-title">{{ site.title }}</span></span>
    </a>
    <div id="header-search">
      <input id="search-input" type="text" placeholder="Search…  ⌘K" autocomplete="off" spellcheck="false">
    </div>
    <div id="header-right">
      <span id="live-dot" title="Live sync"></span>
      <button class="zoom-btn" title="Smaller text">A−</button>
      <button class="zoom-btn" title="Larger text">A+</button>
      <button id="theme-toggle-btn">☀ Light</button>
    </div>
  </div>

  <!-- ── Main ── -->
  <div id="main" style="flex-direction: row;">
    <!-- ── Sidebar ── -->
    <div id="sidebar" style="display: flex;">
      <div id="sidebar-header">
        <span>Files</span>
      </div>
      <div id="file-tree">
        {% for post in site.posts %}
          <div class="tree-item {% if page.url == post.url %}active{% endif %}">
            <span class="tree-icon">📄</span>
            <a href="{{ post.url | relative_url }}" class="tree-name" style="color: inherit; text-decoration: none; padding-left: 5px;">{{ post.title }}</a>
          </div>
        {% endfor %}
      </div>
    </div>
    
    <!-- ── Content ── -->
    <div id="content-area">
      {{ content }}
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
</body>
</html>
