---
layout: base
---
<div class="post-container" style="display: flex; flex-direction: column; justify-content: center; min-height: 70vh;">
  <div style="font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px;">
    Attacker CodeNinja
  </div>
  
  <div style="font-family: var(--mono); font-weight: 700; font-size: clamp(32px,6vw,58px); line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 20px;">
    {{ site.title | default: "Security Research" }}
  </div>
  
  <p style="font-size: 16px; color: var(--text-primary); max-width: 600px; line-height: 1.65;">
    {{ page.subtitle | default: "A collection of writeups, mental models, and exploits built to stay with you permanently." }}
  </p>
  
  <div style="font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 32px;">
    {{ site.posts.size }} chapters available in the sidebar
  </div>

  <div class="post-content" style="margin-top: 40px;">
    {{ content }}
  </div>
</div>
