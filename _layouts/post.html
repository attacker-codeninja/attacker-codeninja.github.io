---
layout: base
---
<article role="main" class="blog-post">
  <div class="fv-header" style="margin-bottom: 20px; padding: 15px 0; border-bottom: 1px solid var(--border);">
    <h1 class="fv-folder-name" style="margin: 0; font-size: 28px;">{{ page.title }}</h1>
    <div class="fv-meta" style="margin-top: 5px; color: var(--text-muted);">{{ page.date | date: "%b %d, %Y" }}</div>
  </div>
  
  <div class="post-content">
    {{ content }}
  </div>
  
  {% if page.tags.size > 0 %}
    <div class="blog-tags" style="margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px;">
      <span style="color: var(--text-muted); margin-right: 10px;">Tags:</span>
      {% for tag in page.tags %}
        <a href="{{ '/tags' | relative_url }}#{{- tag -}}">{{- tag -}}</a>
      {% endfor %}
    </div>
  {% endif %}
</article>
