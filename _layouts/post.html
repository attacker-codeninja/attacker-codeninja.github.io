---
layout: base
---

<article>
  <header class="post-header">
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    
    {% if page.tags.size > 0 %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <a href="{{ '/tags' | relative_url }}#{{- tag -}}" class="post-tag">{{- tag -}}</a>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
